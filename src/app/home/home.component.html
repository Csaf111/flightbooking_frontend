<h1>Welcome to Flight Booking</h1>

<div *ngIf="!isLoggedIn">
  <button (click)="goToLogin()" class="btn btn-primary me-2">
    🔐 Login
  </button>
  <button (click)="goToSignup()" class="btn btn-primary">
    📝 Sign Up
  </button>
</div>

<div *ngIf="isLoggedIn">
  <p class="text-success"><strong>You are successfully logged in.</strong></p>
  <button (click)="logout()" class="btn btn-danger mt-3">
    🚪 Log Out
  </button>
</div>
