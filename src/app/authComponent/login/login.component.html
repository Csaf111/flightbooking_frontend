<h2>Login</h2>

<form (ngSubmit)="login()" #loginForm="ngForm">
  <div>
    <label for="email">Email:</label>
    <input
      type="email"
      id="email"
      name="email"
      [(ngModel)]="user.email"
      required
    />
  </div>

  <div>
    <label for="password">Password:</label>
    <input
      type="password"
      id="password"
      name="password"
      [(ngModel)]="user.password"
      required
    />
  </div>

  <button type="submit" [disabled]="!loginForm.valid">Login</button>
</form>

<p *ngIf="loginSuccess" style="color: green">Login successful!</p>
<p *ngIf="loginError" style="color: red">Invalid credentials. Try again.</p>
